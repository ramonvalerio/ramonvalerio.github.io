name: Keep Supabase active

# Free Supabase projects pause after about a week without database activity,
# which silently breaks the contact form. A tiny read twice a week prevents it.
on:
  schedule:
    - cron: "17 9 * * 1,4" # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the keepalive database function
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # public.keepalive() just returns true; it runs on Postgres, which is
          # what counts as activity, and exposes no data.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer normally (HTTP $status); the project may be paused."
            exit 1
          fi
